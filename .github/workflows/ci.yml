name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # Minimal install: the tested modules only need requests + python-dotenv.
        # The full requirements.txt pulls in scipy/playwright/appium and is not
        # needed (or wanted) for fast CI unit tests.
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests python-dotenv

      - name: Run tests
        run: python -m pytest

  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
